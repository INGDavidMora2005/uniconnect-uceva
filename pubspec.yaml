name: uniconnect_dev
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.2.1

  # Notificaciones
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  dropdown_button2: ^3.0.0

  # Mapas y ubicación
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # HTTP — necesario para llamar a OSRM (polyline de rutas)
  # Antes era solo dependencia transitiva; ahora es directa para
  # evitar que una actualización de dependencias lo elimine sin aviso.
  http: ^1.2.0

  # Imágenes
  image_picker: ^1.2.1

  # Criptografía - Cifrado híbrido RSA + AES-256
  # Basado en Stallings - Cryptography and Network Security
  encrypt: ^5.0.3
  pointycastle: ^3.7.3
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon_app.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon_app.png"
    background_color: "#2EAE7D"
    theme_color: "#2EAE7D"